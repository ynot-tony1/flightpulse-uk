name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Syntactically valid but non-functional — `prisma generate` only reads
  # the schema file, and every data-layer call in the app is guarded to
  # degrade gracefully without a real connection (see lib/db.ts).
  DATABASE_URL: "postgresql://user:pass@localhost:26257/flight_intelligence?sslmode=disable"

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @flightpulse/database generate

      - name: ESLint
        run: pnpm --filter @flightpulse/web lint

      - name: Prettier check
        run: pnpm exec prettier --check "apps/web/**/*.{ts,tsx,css}" "packages/**/*.ts"

      - name: TypeScript
        run: pnpm --filter @flightpulse/web typecheck

      - name: Vitest
        run: pnpm --filter @flightpulse/web test

      - name: Next.js build
        run: pnpm --filter @flightpulse/web build

  ingestor:
    name: Ingestor (ruff, mypy, pytest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff mypy

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

      - name: Build package
        run: pip install build && python -m build

  docker:
    name: Docker (ingestion image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ingestion image
        run: docker build -t flightpulse-ingestor:ci -f services/ingestor/Dockerfile .

      - name: Run --help smoke test
        run: docker run --rm flightpulse-ingestor:ci --help

      - name: Run sources command (no network/database required)
        run: docker run --rm flightpulse-ingestor:ci sources

  security:
    name: Security (secret scan, dependency review)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
